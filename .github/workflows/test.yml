name: Test & Build

on:
  pull_request:
    branches: [main]
  push:
    # main 直推与 codex/* 分支全覆盖:任何人的提交合入都必经本流水线
    branches: [main, codex/*]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # 同时缓存 astro 与 admin-auth 两个子项目的依赖锁文件
          # 注意:必须用块标量多行写法——GitHub 工作流解析器在此位置不接受
          # 流式序列 [a, b](报 "A sequence was not expected",曾致 CI 长期零任务失败)
          cache-dependency-path: |
            astro/package-lock.json
            admin-auth/package-lock.json

      # 安装 astro 前端依赖（测试工具属于 devDependencies，必须显式包含）
      - name: Install dependencies
        run: cd astro && npm ci --include=dev

      # astro/test/ 下的认证生命周期与契约测试不在 vitest include 范围（只匹配 src/**），
      # 必须单独用 node --test 跑，否则这些行为断言永远不执行。
      - name: Admin auth lifecycle tests
        run: cd astro && npm run test:admin-auth

      # 前端单元测试：vitest 为构建前置硬门禁，失败即整体失败。
      # 失败时把日志转成注解（annotations），便于在无 Actions 日志权限时定位。
      - name: Run unit tests
        run: |
          set +e
          cd astro
          echo "node=$(node -v) npm=$(npm -v)"
          npx vitest run 2>&1 | tee "$RUNNER_TEMP/vitest.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 60 "$RUNNER_TEMP/vitest.log" \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | while IFS= read -r line; do echo "::error title=vitest-failure::${line}"; done
          fi
          exit "$status"

      # admin-auth 后端服务测试：npm ci 安装后运行 node --test（mailpit 集成用例在无 MAILPIT_INTEGRATION 时自动跳过）
      - name: Admin-auth tests
        run: cd admin-auth && npm ci && npm test

      # 校验 PocketBase fixture 语法 + 运行真实断言测试
      # 1) find + xargs + node --check 对全部 *.pb.js 做语法门禁（xargs 会传播 node --check 的失败退出码）
      # 2) node --test 运行 security-rate 日志安全与 mail-local 保留契约断言
      # 任一条命令失败（set -e）即该步骤失败，形成 CI 硬门禁
      - name: Validate pb fixtures
        run: |
          set -euo pipefail
          # 生产 hooks 与迁移同样必须过语法门禁：PB 启动时单个 hook 语法错误会被跳过，
          # 只查 tests/ 会让这种错误静默上线。
          find pb_hooks pb_migrations -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests -name '*.pb.js' -print0 | xargs -0 -n1 node --check
          node --test tests/security-rate/hook_log_safety.test.js tests/mail-local/account_retention_integration_contract.js

      # 前端代码规范检查（eslint，项目级扁平配置 astro/eslint.config.mjs）
      - name: Lint
        run: cd astro && npm run lint

      # 前端类型检查（astro check，覆盖 .astro 与 TS/TSX 文件）
      # 注意:astro.config.mjs 对生产构建强制要求 PUBLIC_SITE_URL,与 Build 步同参
      - name: Check
        run: cd astro && npm run check
        env:
          PUBLIC_SITE_URL: https://blog.example.com
          PUBLIC_POCKETBASE_URL: http://localhost:8090

      # 生产构建（前端静态产物），随后上传制品
      - name: Build
        run: cd astro && npm run build
        env:
          PUBLIC_SITE_URL: https://blog.example.com
          PUBLIC_POCKETBASE_URL: http://localhost:8090

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: astro-dist
          path: astro/dist/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: astro/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # 真实 PocketBase 0.22.48 安全回归：脚本会自行下载官方二进制到 tmp/ 并起隔离实例。
  # 这些用例覆盖登录限流/可信代理、关系遍历守卫、邮箱枚举、评论字段固定等 P0 修复，
  # 之前只存在于「人工记得跑一次」，CI 全绿并不代表这些路径没退化。
  security-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [baseline, relation, mail, login, comments, fields, abuse]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run PocketBase security suite (${{ matrix.suite }})
        run: node scripts/test-pentest-remediation-local.mjs --suite ${{ matrix.suite }}
        env:
          MAIL_GATEWAY_ENABLED: "false"
          MAIL_ACCOUNT_ENABLED: "false"
          MAIL_OTP_ENABLED: "false"

  # CD:仅在 main 分支推送且 CI 全绿时触发;需仓库配置 vars.DEPLOY_ENABLED=true
  # 与 secrets.SSH_HOST/SSH_USER/SSH_PRIVATE_KEY(可选 SSH_PORT)后才会真正执行,
  # 未配置时自动跳过而不是失败。仅部署前端 SSR 产物;pb_hooks/Caddy 变更仍需人工。
  deploy:
    name: Deploy to production
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: astro-dist
          path: astro/dist/

      - name: Package SSR dist
        run: cd astro/dist && tar -czf "$RUNNER_TEMP/dist_pkg.tar.gz" client server

      - name: Upload package to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "${{ runner.temp }}/dist_pkg.tar.gz"
          target: /tmp/

      - name: Atomic sync & restart on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          PKG: ${{ runner.temp }}/dist_pkg.tar.gz
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: PKG
          script: |
            set -e
            CUR=/opt/hlydwz-blog/current
            rm -rf /tmp/dist_pkg && mkdir -p /tmp/dist_pkg
            tar xzf "$PKG" -C /tmp/dist_pkg
            # 与 scripts/deploy-ssr.sh 同一套原地同步逻辑:404.html 与 pagefind 不属于构建产物
            rsync -a --delete --exclude='404.html' --exclude='404.html.bak*' --exclude='pagefind/' /tmp/dist_pkg/client/ $CUR/astro/dist/
            rsync -a --delete /tmp/dist_pkg/client/ $CUR/dist/client/
            rsync -a --delete /tmp/dist_pkg/server/ $CUR/dist/server/
            rsync -a /tmp/dist_pkg/client/ $CUR/dist/
            systemctl restart blog-astro-ssr
            sleep 4
            curl -fsS -o /dev/null -w 'SSR smoke: %{http_code}\n' http://127.0.0.1:4321/
            curl -fsS -o /dev/null -w 'Web smoke: %{http_code}\n' https://hlydwz.com/
            rm -rf /tmp/dist_pkg "$PKG"
