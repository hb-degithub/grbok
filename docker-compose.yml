version: "3.8"

services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: blog-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-18080}:80"
      # 管理通道：PB 原生后台/超管 API 专用（Caddyfile :8080 块），仅宿主机/SSH 隧道可达。
      # 公网 80 上这些路径已无条件 404（2026-09-20 审计修复：头伪造与网关源 IP 均不可作判据）。
      - "127.0.0.1:18081:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./astro/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # /_ 与 /api/admins 公网默认全封（Caddyfile 仅放行回环 127.0.0.1 = SSH 隧道，
      # 以及此处显式配置的 ADMIN_IP）。默认 192.0.2.1 为保留测试地址（永不匹配），
      # 切勿改回 0.0.0.0/0 —— 那会重新把 PB 管理后台暴露到公网。
      - ADMIN_IP=${ADMIN_IP:-192.0.2.1}
      - OPENRESTY_TRUSTED_PROXY=${OPENRESTY_TRUSTED_PROXY}
    networks:
      - blog_network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin-auth:
    build:
      context: ./admin-auth
    container_name: blog-admin-auth
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      - NODE_ENV=production
      - ADMIN_AUTH_INTERNAL_SECRET=${ADMIN_AUTH_INTERNAL_SECRET}
      - ADMIN_AUTH_HASH_SECRET=${ADMIN_AUTH_HASH_SECRET}
      - ADMIN_AUTH_RP_ID=${ADMIN_AUTH_RP_ID:-hlydwz.com}
      - ADMIN_AUTH_ORIGIN=${ADMIN_AUTH_ORIGIN:-https://hlydwz.com}
      - ADMIN_AUTH_SESSION_TTL_SECONDS=${ADMIN_AUTH_SESSION_TTL_SECONDS:-900}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      - SMTP_TLS_MODE=${SMTP_TLS_MODE:-auto}
      - SMTP_CONNECTION_TIMEOUT_MS=${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      - SMTP_SOCKET_TIMEOUT_MS=${SMTP_SOCKET_TIMEOUT_MS:-30000}
      - MAIL_PROVIDER_LABEL=${MAIL_PROVIDER_LABEL:-Standard SMTP}
      - MAIL_ALERT_RECIPIENTS=${MAIL_ALERT_RECIPIENTS:-}
      - MAIL_INTERNAL_SECRET=${MAIL_INTERNAL_SECRET}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://hlydwz.com}
      - ALIYUN_SMTP_HOST=${ALIYUN_SMTP_HOST:-}
      - ALIYUN_SMTP_PORT=${ALIYUN_SMTP_PORT:-}
      - ALIYUN_SMTP_USER=${ALIYUN_SMTP_USER:-}
      - ALIYUN_SMTP_PASSWORD=${ALIYUN_SMTP_PASSWORD:-}
      - ALIYUN_FROM_EMAIL=${ALIYUN_FROM_EMAIL:-}
      - ALIYUN_FROM_NAME=${ALIYUN_FROM_NAME:-}
      # ESA API 凭据(轻量云无实例 RAM 角色时的落地方式;ECS 上可留空走 STS)
      - ESA_ACCESS_KEY_ID=${ESA_ACCESS_KEY_ID:-}
      - ESA_ACCESS_KEY_SECRET=${ESA_ACCESS_KEY_SECRET:-}
      - ESA_SITE_ID=${ESA_SITE_ID:-}
    networks:
      - blog_network
    user: "node"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pocketbase:
    # 2026-09-20 安全升级：0.22.21 → 0.22.48（CVE-2026-82410 panic-DoS 修复于 0.22.48，
    # GHSA-pq7p-mc74-g65w OAuth2 预劫持修复于 0.22.42）。muchobien 镜像线止于 0.22.32，
    # 故用官方 release 二进制自建等价镜像：bash scripts/build-pb-image.sh 0.22.48
    image: pocketbase:0.22.48-hlydwz
    container_name: blog-pocketbase
    restart: unless-stopped
    volumes:
      - pb_data:/pb_data
      - ./pb_migrations:/pb_migrations:ro
      - ./pb_hooks:/pb_hooks:ro
    environment:
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY}
      - TZ=${TZ:-Asia/Shanghai}
      - ADMIN_AUTH_INTERNAL_URL=http://admin-auth:8787
      - ADMIN_AUTH_INTERNAL_SECRET=${ADMIN_AUTH_INTERNAL_SECRET}
      - ADMIN_AUTH_HASH_SECRET=${ADMIN_AUTH_HASH_SECRET}
      - ADMIN_IP=${ADMIN_IP}
      - MAIL_INTERNAL_SECRET=${MAIL_INTERNAL_SECRET}
      - MAIL_HASH_SECRET=${MAIL_HASH_SECRET}
      - MAIL_ARCHIVE_HMAC_SECRET=${MAIL_ARCHIVE_HMAC_SECRET}
      - MAIL_ARCHIVE_API_ENABLED=${MAIL_ARCHIVE_API_ENABLED:-false}
      - ACCOUNT_RETENTION_REMINDER_ENABLED=${ACCOUNT_RETENTION_REMINDER_ENABLED:-false}
      - ACCOUNT_RETENTION_DELETE_ENABLED=${ACCOUNT_RETENTION_DELETE_ENABLED:-false}
      - MAIL_GATEWAY_INTERNAL_URL=http://admin-auth:8787
      - MAIL_GATEWAY_ENABLED=${MAIL_GATEWAY_ENABLED:-false}
      - MAIL_ACCOUNT_ENABLED=${MAIL_ACCOUNT_ENABLED:-false}
      - MAIL_OTP_ENABLED=${MAIL_OTP_ENABLED:-false}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://hlydwz.com}
    networks:
      - blog_network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
    depends_on:
      admin-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    name: blog_caddy_data
  caddy_config:
    name: blog_caddy_config
  pb_data:
    name: blog_pb_data

networks:
  blog_network:
    name: blog_network
    driver: bridge
